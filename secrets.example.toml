# daftcron secrets - copy this file to secrets.toml and fill it in.
#
#   cp secrets.example.toml secrets.toml
#
# secrets.toml is listed in .gitignore, so credentials never reach version
# control. config.toml stays versioned because it holds the tuned settings.
#
# Precedence, lowest to highest:
#   config.toml  <  secrets.toml  <  environment variables
#
# So you can also leave this file alone entirely and export instead:
#   DAFTCRON_TELEGRAM_TOKEN, DAFTCRON_TELEGRAM_CHAT, DAFTCRON_IMAP_PASSWORD

[notify]
# From @BotFather when you send /newbot.
# Looks like: 8123456789:AAF3kQ9x...
telegram_token = ""

# The number from
#   https://api.telegram.org/bot<TOKEN>/getUpdates
# under "chat":{"id":...}
telegram_chat_id = ""

[ingest]
# Only needed when ingest.source = "imap". Not secret, but it identifies you,
# so it lives here rather than in the versioned config.
# The IMAP *password* is deliberately not allowed here - supply it via
# DAFTCRON_IMAP_PASSWORD or the macOS Keychain.
imap_user = ""
