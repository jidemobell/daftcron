"dundalk-louth"            = 76
"rathnew-wicklow"          = 78
"wicklow-town-wicklow"     = 80
"portlaoise-laois"         = 84
"tullamore-offaly"         = 86
"athlone-westmeath"        = 88
"tinahely-wicklow"         = 92
"kilcormac-offaly"         = 94
"durrow-laois"             = 95
"ferbane-offaly"           = 95
"birr-offaly"              = 98

# ── County defaults ──────────────────────────────────────────────────────────
# Used only when no specific area above matches. These are deliberately
# PESSIMISTIC, and that is the point: a town that reaches the fallback is one
# the table knows nothing about, and an unknown place must not be flattered
# into the alert. They were previously set to a "typical" value, which is
# precisely how unchecked towns got promoted.
"dublin"                   = 38
"meath"                    = 40
"kildare"                  = 42
"louth"                    = 58
"westmeath"                = 65
"offaly"                   = 86
"laois"                    = 84
"wicklow"                  = 72

# ─────────────────────────────────────────────────────────────────────────────
# RAIL — a small bonus, not a second commute
#
# Rewards a town with a commuter rail service into Dublin, because that keeps
# working if the job moves to the city. It is worth points, not a veto: it
# nudges a Naas or a Dunboyne up the list without re-weighting the ranking for
# a job that has not been applied for.
#
# Deliberately absent: NAVAN. There is no railway station there — the Navan
# line closed and the M3 Parkway is the nearest stop, about 15 minutes' drive
# out of town. Navan is fine for Damastown and poor for the city, which is the
# whole reason it should not collect this bonus.
# ─────────────────────────────────────────────────────────────────────────────
[rail]
# Matched as a substring of the address slug, the same way [commute.times] is.
# Keep entries distinctive — a short one like "rush" can appear inside an
# unrelated street name and award the bonus by accident.
towns = [
  # Western commuter line and the M3 Parkway branch. The best of both worlds:
  # train to the city AND a short drive to Damastown.
  "castleknock", "clonsilla", "coolmine", "hansfield", "dunboyne",
  "m3-parkway", "ashtown", "pelletstown", "broombridge",
  "leixlip", "confey", "louisa-bridge", "maynooth", "kilcock",

  # Kildare line into Heuston, plus the Sallins & Naas park-and-ride.
  "sallins", "naas", "newbridge", "kildare-town", "hazelhatch",
  "celbridge", "adamstown", "clondalkin", "monasterevin",
  "portarlington", "tullamore",

  # Northern commuter, M1 corridor.
  "balbriggan", "skerries", "donabate", "malahide", "portmarnock",
  "clongriffin", "laytown", "gormanston", "drogheda", "dundalk",

  # Bray and the Wicklow coast.
  "bray", "greystones", "kilcoole", "rathdrum", "arklow", "wicklow-town",

  # City end of the Maynooth line, for completeness.
  "drumcondra",
]

# ─────────────────────────────────────────────────────────────────────────────
# NOTIFY
#
# Leave the credentials below EMPTY in this file. Put them in secrets.toml
# (copy secrets.example.toml) or in environment variables instead — this file
# is versioned, and a Telegram bot token is a live credential.
# ─────────────────────────────────────────────────────────────────────────────
[notify]
telegram_enabled = true
telegram_token = ""       # -> secrets.toml or DAFTCRON_TELEGRAM_TOKEN
telegram_chat_id = ""     # -> secrets.toml or DAFTCRON_TELEGRAM_CHAT

# ─────────────────────────────────────────────────────────────────────────────
# ENQUIRY — the message to send an agent when you want a viewing
#
# Generated on demand. NEVER sent automatically, and no recipient is filled in:
# a real Daft alert email carries no agent contact details whatsoever — no name,
# no email address, no phone number. Daft agents are normally contacted through
# Daft's own "Contact Agent" form on the listing page, so the flow is: open the
# listing, choose Contact Agent, paste the prepared message.
#
# Set enabled = false to leave it out of alerts entirely.
# ─────────────────────────────────────────────────────────────────────────────
[enquiry]
enabled = true
name = "Jide"            # your name, as you want it signed
phone = ""               # optional, appended under your name
email = ""               # optional, appended under your name
occupation = "software engineer"
employer = "IBM"

# Included to signal a settled, committed tenant rather than someone browsing.
# Set 0 to leave the line out — the strongest signals to an agent are employment,
# references and a firm move-in date, and those carry the message on their own.
age = 44

available_from = "December"  # when you can take a new lease
lease_ends = "6 January"     # when your current lease ends; blank to omit
extra = ""                   # any extra line you want, or "" for none

# Your own wording for the "about me" paragraph. When set, this replaces the
# line daftcron would otherwise build from occupation/employer/age above.
#
# Worth using your own words. The generated version is accurate but reads like
# a form ("44, a software engineer at IBM"), and an agent receives a lot of
# those. The qualities that actually reassure a landlord are the ones below:
# non-smoker, quiet, tidy, and a previous landlord who would speak for you.
#
# ⚠ If you rewrap this, keep any space BEFORE the trailing backslash. TOML eats
#   the newline and the next line's leading whitespace, so "...person, \" works
#   and "...person,\" silently produces "person,tidy".
about = """
I'm a software developer with IBM — a non-smoker, very affable, quiet and not a \
party person, tidy, and on good terms with my previous landlord, with a \
reference available if useful.
"""

# ─────────────────────────────────────────────────────────────────────────────
[report]
top_n = 100               # rows written to out/report.html
