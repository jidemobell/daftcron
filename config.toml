"santry-dublin"            = 36
"tallaght-dublin"          = 38
"clane-kildare"            = 40
"trim-meath"               = 42
"enfield-meath"            = 42
"dublin-city"              = 42
"artane-dublin"            = 42
"bray-wicklow"             = 45
"naas-kildare"             = 45
"navan-meath"              = 45
"kinnegad-westmeath"       = 46
"kilcullen-kildare"        = 48
"athboy-meath"             = 48

# ── 50-65 min: a stretch — only worth it for a materially better home ──────
"drumcondra-dublin"        = 50
"dun-laoghaire-dublin"     = 52
"clonmellon-westmeath"     = 54
"nurney-kildare"           = 55
"edenderry-offaly"         = 55
"kells-meath"              = 55
"newbridge-kildare"        = 58
"rathgar-dublin"           = 58
"rathmines-dublin"         = 58
"drogheda-louth"           = 58
